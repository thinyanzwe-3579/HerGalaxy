<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Descent</title>
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Full-screen 3D scene -->
    <canvas id="scene"></canvas>

    <!-- Fixed overlay (text, HUD, intro) -->
    <div id="overlay">

        <!-- Opening: the galaxy -->
        <div id="intro">
            <p class="intro-eyebrow">The Milky Way</p>
            <p class="intro-title-sub">One hundred billion worlds.<br>We begin with the farthest.</p>
            <p class="intro-hint">Scroll to descend</p>
            <!-- Hidden message — only revealed to those who pay attention -->
            <div class="hidden-message">For my Precious Little Galaxy</div>
        </div>

        <!-- Planet info panels injected by JS -->
        <div id="info-layer"></div>

        <!-- HUD -->
        <div id="hud">
            <div id="hud-name"></div>
            <div id="hud-track"><span id="hud-fill"></span></div>
        </div>

    </div>

    <!-- Faint texture attribution -->
    <div class="credit">Textures: Solar System Scope (CC BY 4.0) · based on NASA imagery</div>

    <!-- Tall spacer that creates the scroll length -->
    <div id="scroll-space"></div>

    <script src="lib/three.min.js"></script>
    <!-- Post-processing (self-hosted three.js r128 modules) -->
    <script src="lib/CopyShader.js"></script>
    <script src="lib/LuminosityHighPassShader.js"></script>
    <script src="lib/GammaCorrectionShader.js"></script>
    <script src="lib/EffectComposer.js"></script>
    <script src="lib/ShaderPass.js"></script>
    <script src="lib/MaskPass.js"></script>
    <script src="lib/RenderPass.js"></script>
    <script src="lib/UnrealBloomPass.js"></script>
    <script src="script.js"></script>
</body>
</html>
