<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Descent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Full-screen 3D scene -->
    <canvas id="scene"></canvas>

    <!-- Fixed overlay (text, HUD, intro) -->
    <div id="overlay">

        <!-- Opening: deep space, no planets -->
        <div id="intro">
            <p class="intro-eyebrow">A Journey Through The Solar System</p>
            <p class="intro-hint">Scroll to begin the descent</p>
            <!-- Hidden message — only revealed to those who pay attention -->
            <div class="hidden-message">For my Precious Little Galaxy</div>
        </div>

        <!-- Planet info panels injected by JS -->
        <div id="info-layer"></div>

        <!-- HUD -->
        <div id="hud">
            <div id="hud-name"></div>
            <div id="hud-track"><span id="hud-fill"></span></div>
        </div>

    </div>

    <!-- Faint texture attribution -->
    <div class="credit">Textures: Solar System Scope (CC BY 4.0) · based on NASA imagery</div>

    <!-- Tall spacer that creates the scroll length -->
    <div id="scroll-space"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
